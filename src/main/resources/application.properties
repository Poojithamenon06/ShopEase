spring.application.name=ShopEase
server.port=8081

# ---- MySQL (change username/password if yours are different) ----
spring.datasource.url=jdbc:mysql://localhost:3306/shopease_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Ammu2006

# ---- JPA: tables are created automatically ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

# ---- DummyJSON product import (https://dummyjson.com/products - free, no API key needed) ----
# On first start the catalogue is loaded from DummyJSON into MySQL (all categories, ~194 products).
shopease.dummyjson.enabled=true
shopease.dummyjson.base-url=https://dummyjson.com
