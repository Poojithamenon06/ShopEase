<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Product Form')}"></head>
<body>
<th:block th:replace="~{fragments :: header}"></th:block>

<main class="container page narrow">
  <h1 class="page-title" th:text="${product.id == null} ? 'Add Product' : 'Edit Product'">Add Product</h1>

  <form class="card form-card" th:action="@{/admin/products/save}" th:object="${product}" method="post">
    <input type="hidden" th:field="*{id}">

    <label for="name">Product name</label>
    <input id="name" type="text" th:field="*{name}" th:errorclass="invalid" placeholder="e.g. Cotton T-Shirt">
    <small class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">error</small>

    <div class="two-col">
      <div>
        <label for="category">Category</label>
        <input id="category" type="text" th:field="*{category}" list="catList" th:errorclass="invalid" placeholder="e.g. Men">
        <datalist id="catList"><option th:each="c : ${categories}" th:value="${c}"></option></datalist>
        <small class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">error</small>
      </div>
      <div>
        <label for="brand">Brand (optional)</label>
        <input id="brand" type="text" th:field="*{brand}" placeholder="e.g. UrbanEdge">
      </div>
    </div>

    <div class="two-col">
      <div>
        <label for="price">Selling price (₹)</label>
        <input id="price" type="number" step="0.01" min="0" th:field="*{price}" th:errorclass="invalid" placeholder="0.00">
        <small class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">error</small>
      </div>
      <div>
        <label for="mrp">MRP / original price (₹, optional)</label>
        <input id="mrp" type="number" step="0.01" min="0" th:field="*{mrp}" placeholder="Shown struck-through">
      </div>
    </div>

    <div class="two-col">
      <div>
        <label for="stock">Stock quantity</label>
        <input id="stock" type="number" min="0" th:field="*{stock}" th:errorclass="invalid" placeholder="0">
        <small class="field-error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}">error</small>
      </div>
      <div>
        <label for="rating">Rating 0–5 (optional)</label>
        <input id="rating" type="number" step="0.1" min="0" max="5" th:field="*{rating}" th:errorclass="invalid" placeholder="4.2">
        <small class="field-error" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}">error</small>
      </div>
    </div>

    <div class="two-col">
      <div>
        <label for="color">Color (optional)</label>
        <input id="color" type="text" th:field="*{color}" placeholder="e.g. Navy Blue">
      </div>
      <div>
        <label for="fabric">Fabric / material (optional)</label>
        <input id="fabric" type="text" th:field="*{fabric}" placeholder="e.g. Cotton">
      </div>
    </div>

    <label for="sizes">Sizes (optional, comma separated)</label>
    <input id="sizes" type="text" th:field="*{sizes}" placeholder="e.g. S,M,L,XL  or  7,8,9,10">

    <label for="imageUrl">Image URL (optional)</label>
    <input id="imageUrl" type="text" th:field="*{imageUrl}" placeholder="https://…">

    <label for="description">Description</label>
    <textarea id="description" rows="5" th:field="*{description}" placeholder="Describe the product…"></textarea>

    <div class="btn-row mt">
      <button class="btn btn-primary btn-lg" type="submit">Save Product</button>
      <a class="btn btn-ghost btn-lg" th:href="@{/admin/products}">Cancel</a>
    </div>
  </form>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
